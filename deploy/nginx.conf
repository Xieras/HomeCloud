# /etc/nginx/sites-available/homecloud
# После установки выполните: certbot --nginx -d ВАШ.ДОМЕН
# — certbot сам добавит HTTPS и редирект с 80 порта.

limit_req_zone $binary_remote_addr zone=hc_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Файлы любого размера, без буферизации на диске nginx
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location /static/ {
        alias /opt/homecloud/static/;
        expires 7d;
        access_log off;
    }

    # Ограничение частоты запросов на страницу входа
    location = /login {
        limit_req zone=hc_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/homecloud-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/homecloud-proxy.conf;
    }
}
